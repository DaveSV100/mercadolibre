# Publishes or removes a coupon sent from the site's /publicar/ page (an issue opened by the repo owner),
# then republishes the site.
name: Publicar cupones

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  coupon:
    if: (startsWith(github.event.issue.title, 'Cupón') || startsWith(github.event.issue.title, 'Quitar cupón')) && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: update-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guardar cupón
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/save-coupon.mjs | tee result.txt
      - name: Subir cambios, cerrar el issue y actualizar el sitio
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coupons.json
          git diff --cached --quiet || { git commit -m "Actualizar cupones"; git pull --rebase origin main; git push origin HEAD:main; }
          gh issue close "$ISSUE" --comment "✅ $(cat result.txt) El sitio se está actualizando."
          gh workflow run update.yml --ref main
