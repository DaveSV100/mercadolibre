# Finds new deals, rebuilds the website, publishes it on GitHub Pages and posts to Telegram.
# Runs every 2 hours, on every push to main, and on demand (Actions tab -> "Actualizar ofertas" -> Run workflow).
name: Actualizar ofertas

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Probar el código
        run: npm test

      - name: Buscar ofertas en Mercado Libre
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: node scripts/fetch-deals.mjs

      - id: pages
        uses: actions/configure-pages@v5

      # Uses the address GitHub Pages reports, so connecting the custom domain needs no code change.
      - name: Construir el sitio
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar el sitio
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Publicar en Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/post-telegram.mjs

      - name: Guardar las ofertas en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.json data/posted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Actualizar ofertas"
          git pull --rebase origin main
          git push origin HEAD:main
